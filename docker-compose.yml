services:
  db:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1strategy}
      POSTGRES_USER: ${POSTGRES_USER:-f1strategy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-f1strategy} -d ${POSTGRES_DB:-f1strategy}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: f1api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-f1strategy}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-f1strategy}
      REDIS_URL: redis://redis:6379/0
      F1_CONFIG_DIR: /app/config
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - ./data:/app/data
      # Keep the image's Linux venv: without this the bind mount above exposes the
      # host's backend/.venv (a Mac one) at /app/.venv, and host `uv` runs and this
      # container clobber each other's environment.
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: f1api/Dockerfile
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "f1state.worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-f1strategy}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-f1strategy}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - ./data:/app/data
      # Keep the image's Linux venv: without this the bind mount above exposes the
      # host's backend/.venv (a Mac one) at /app/.venv, and host `uv` runs and this
      # container clobber each other's environment.
      - /app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./web
    restart: unless-stopped
    environment:
      API_BASE_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "4200:4200"
    volumes:
      - ./web:/app
      - /app/node_modules

volumes:
  db_data:
