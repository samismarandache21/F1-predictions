name: CI

on:
  push:
  pull_request:

# CI never talks to the network for test data: replay/property tests run against
# fixtures recorded under tests/fixtures/. Live API calls are exercised only by
# `make ingest`, which is not part of this workflow.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    # Timescale/Postgres is local-to-CI infrastructure, not an external network
    # call — DB-touching tests (schema, idempotent upsert) run against it here.
    # Tests marked `network` (live OpenF1/Jolpica/Open-Meteo calls) are excluded.
    services:
      db:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_DB: f1strategy_test
          POSTGRES_USER: f1strategy
          POSTGRES_PASSWORD: f1strategy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U f1strategy -d f1strategy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        working-directory: backend
        run: uv sync --all-packages --dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy --strict (f1core)
        working-directory: backend
        run: uv run mypy --strict f1core/src/f1core

      - name: Apply migrations
        working-directory: backend
        run: uv run alembic -c f1api/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://f1strategy:f1strategy@localhost:5432/f1strategy_test

      - name: pytest
        working-directory: backend
        run: uv run pytest ../tests -q -m "not network"
        env:
          DATABASE_URL: postgresql+psycopg://f1strategy:f1strategy@localhost:5432/f1strategy_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test -- --watch=false --browsers=ChromeHeadless
