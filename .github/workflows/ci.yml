name: CI

on:
  push:
  pull_request:

# CI never talks to the network for test data: replay/property tests run against
# fixtures recorded under tests/fixtures/. Live API calls are exercised only by
# `make ingest`, which is not part of this workflow.
env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync workspace
        working-directory: backend
        run: uv sync --all-packages --dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy --strict (f1core)
        working-directory: backend
        run: uv run mypy --strict f1core/src/f1core

      - name: pytest
        working-directory: backend
        run: uv run pytest ../tests -q
        env:
          F1_NO_NETWORK: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test -- --watch=false --browsers=ChromeHeadless
