[tool.uv.workspace]
members = [
    "f1core",
    "f1ingest",
    "f1state",
    "f1track",
    "f1models",
    "f1engine",
    "f1calib",
    "f1api",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
    "network: hits a live external API (OpenF1/Jolpica/Open-Meteo); excluded from CI",
]
