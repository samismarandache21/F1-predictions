[project]
name = "f1ingest"
version = "0.1.0"
description = "Source adapters (OpenF1 historical/live, FastF1, Jolpica, Open-Meteo, replay) behind a common SourceAdapter interface."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "httpx>=0.27",
    "tenacity>=9.0",
    "fastf1>=3.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "pydantic>=2.9",
    "click>=8.1",
]

[tool.uv.sources]
f1core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1ingest"]
