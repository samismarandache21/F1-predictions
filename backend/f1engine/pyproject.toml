[project]
name = "f1engine"
version = "0.1.0"
description = "Deterministic race predictor and Monte Carlo simulation engine. Out of scope until M4+."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "f1models",
    "numpy>=2.0",
]

[tool.uv.sources]
f1core = { workspace = true }
f1models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1engine"]
