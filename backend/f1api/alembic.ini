[alembic]
# %(here)s resolves relative to this file, so `make migrate` works regardless
# of the caller's cwd (Makefile runs it from backend/).
script_location = %(here)s/migrations
prepend_sys_path = .

# Overridden at runtime from the DATABASE_URL env var in migrations/env.py;
# left blank here so no credentials are ever committed.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
