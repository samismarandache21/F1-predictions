[project]
name = "f1models"
version = "0.1.0"
description = "Tyre, pace, pit, overtake, energy, weather and damage models. Out of scope until M2+."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "numpy>=2.0",
]

[tool.uv.sources]
f1core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1models"]
