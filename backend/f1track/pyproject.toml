[project]
name = "f1track"
version = "0.1.0"
description = "Circuit geometry builder: polyline from location samples, projection, speed profiles."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "numpy>=2.0",
    "scipy>=1.14",
    "pydantic>=2.9",
]

[tool.uv.sources]
f1core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1track"]
