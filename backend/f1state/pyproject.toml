[project]
name = "f1state"
version = "0.1.0"
description = "Race state builder: consumes normalised domain events and maintains the authoritative RaceState snapshot."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "f1models",
    "f1engine",
    "redis>=5.0",
    "pydantic>=2.9",
]

[tool.uv.sources]
f1core = { workspace = true }
f1models = { workspace = true }
f1engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1state"]
