[project]
name = "f1calib"
version = "0.1.0"
description = "Offline model-fitting jobs and the model artifact store. Out of scope until M2+."
requires-python = ">=3.12"
dependencies = [
    "f1core",
    "f1models",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]

[tool.uv.sources]
f1core = { workspace = true }
f1models = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1calib"]
