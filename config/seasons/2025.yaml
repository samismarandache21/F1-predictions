# 2025 season config, used for the Phase 1 fixture race (Italian GP, Monza).
# 10 teams, 20 cars — the last season before the 2026 Cadillac expansion.
# Round numbers for mid-season swaps are best-effort recollection and MUST be
# verified against Jolpica during ingestion (T4); update the `rounds` ranges below
# once confirmed rather than trusting this file blindly.

season: 2025
grid_size: 20
rounds: 24
overtake_aid: drs   # last season with DRS
points_table: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]
fastest_lap_point: false
min_green_flag_laps_for_points: 2

compound_rules:
  dry_compounds: [C1, C2, C3, C4, C5, C6]
  nominated_per_event: 3
  two_compound_rule: true
  wet_compounds: [INTERMEDIATE, WET]
  monaco_mandatory_two_stop: true   # 2025-only rule, removed for 2026

teams:
  - id: red_bull
    name: Red Bull Racing
    colour: "#3671C6"
  - id: mclaren
    name: McLaren
    colour: "#FF8000"
  - id: ferrari
    name: Ferrari
    colour: "#E8002D"
  - id: mercedes
    name: Mercedes
    colour: "#27F4D2"
  - id: aston_martin
    name: Aston Martin
    colour: "#229971"
  - id: alpine
    name: Alpine
    colour: "#0093CC"
  - id: williams
    name: Williams
    colour: "#64C4FF"
  - id: racing_bulls
    name: Racing Bulls
    colour: "#6692FF"
  - id: haas
    name: Haas
    colour: "#B6BABD"
  - id: kick_sauber
    name: Kick Sauber
    colour: "#52E252"

drivers:
