    number: 30
    code: LAW
    name: Liam Lawson
    entries:
      - {team: red_bull, rounds: [1, 2]}
      - {team: racing_bulls, rounds: [3, 24]}
    note: "Demoted after round 2; verify exact round against Jolpica."
