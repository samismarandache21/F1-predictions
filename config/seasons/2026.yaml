# 2026 season config. Source: docs/f1-driver-circuit-intel.md §1, §3 (snapshot 16 Sep 2026,
# after round 14). Car numbers and team colours are best-effort placeholders pending
# verification against the official FIA entry list — see the `note` fields.
#
# kind: prior everywhere in this file — these are config values, not observed/estimated data.

season: 2026
grid_size: 22
rounds: 23
overtake_aid: overtake_mode   # DRS does not exist in 2026; see docs/f1-strategy-foundation.md §2
points_table: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]
fastest_lap_point: false
min_green_flag_laps_for_points: 2

compound_rules:
  dry_compounds: [C1, C2, C3, C4, C5]   # C6 dropped for 2026
  nominated_per_event: 3                # Pirelli picks 3 of 5, labelled Hard/Medium/Soft
  two_compound_rule: true               # at least 2 different dry compounds in a dry race
  wet_compounds: [INTERMEDIATE, WET]
  monaco_mandatory_two_stop: false      # removed for 2026

teams:
  - id: mercedes
    name: Mercedes
    colour: "#27F4D2"
  - id: ferrari
    name: Ferrari
    colour: "#E8002D"
  - id: mclaren
    name: McLaren
    colour: "#FF8000"
  - id: red_bull
    name: Red Bull Racing
    colour: "#3671C6"
  - id: racing_bulls
    name: Racing Bulls
    colour: "#6692FF"
  - id: alpine
    name: Alpine
    colour: "#0093CC"
  - id: haas
    name: Haas
    colour: "#B6BABD"
  - id: audi
    name: Audi
    colour: "#BB0A30"
  - id: williams
    name: Williams
    colour: "#64C4FF"
  - id: aston_martin
    name: Aston Martin
    colour: "#229971"
  - id: cadillac
    name: Cadillac
    colour: "#8A2BE2"
    note: "New 2026 entrant (11th team). Colour is a placeholder; verify against livery reveal."

