# 2026 season config. Source: docs/f1-driver-circuit-intel.md §1, §3 (snapshot 16 Sep 2026,
# after round 14). Car numbers and team colours were cross-checked against live Jolpica
# (results) and OpenF1 (drivers) data on 2026-09-17 during T4 and corrected where wrong —
# see docs/plan/phase-1.md T4's validation requirement. One real error was caught this way:
# Norris carries #1 as 2025 champion, Verstappen reverted to #3 (this file previously had
# them the other way around).
#
# kind: prior everywhere in this file — these are config values, not observed/estimated data.

season: 2026
grid_size: 22
rounds: 23
overtake_aid: overtake_mode   # DRS does not exist in 2026; see docs/f1-strategy-foundation.md §2
points_table: [25, 18, 15, 12, 10, 8, 6, 4, 2, 1]
fastest_lap_point: false
min_green_flag_laps_for_points: 2

compound_rules:
  dry_compounds: [C1, C2, C3, C4, C5]   # C6 dropped for 2026
  nominated_per_event: 3                # Pirelli picks 3 of 5, labelled Hard/Medium/Soft
  two_compound_rule: true               # at least 2 different dry compounds in a dry race
  wet_compounds: [INTERMEDIATE, WET]
  monaco_mandatory_two_stop: false      # removed for 2026

# Colours are verified real values from OpenF1 `drivers[].team_colour` (session_key=11369,
# the actual 2026 Spanish GP at Madring), fetched 2026-09-17.
teams:
  - id: mercedes
    name: Mercedes
    colour: "#00D7B6"
  - id: ferrari
    name: Ferrari
    colour: "#ED1131"
  - id: mclaren
    name: McLaren
    colour: "#F47600"
  - id: red_bull
    name: Red Bull Racing
    colour: "#4781D7"
  - id: racing_bulls
    name: Racing Bulls
    colour: "#6C98FF"
  - id: alpine
    name: Alpine
    colour: "#00A1E8"
  - id: haas
    name: Haas
    colour: "#9C9FA2"
  - id: audi
    name: Audi
    colour: "#F50537"
  - id: williams
    name: Williams
    colour: "#1868DB"
  - id: aston_martin
    name: Aston Martin
    colour: "#229971"
  - id: cadillac
    name: Cadillac
    colour: "#909090"
    note: "New 2026 entrant (11th team)."

